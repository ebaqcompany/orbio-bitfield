<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbio Protocol Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one hero on a 20px bit field. Text blocks knock the field out on whole cells (like a
   printed grid with type set in cleared boxes); the marble hand sits on the live field at right.
   Two variants: Void (default, like the current /protocol page) and Marble. Brass is the sub-brand colour. */
:root {
  --ground: #0B0B0C;          /* Void */
  --fg: #FFFAEE;              /* Marble */
  --muted: rgba(255, 250, 238, .7);
  --line: rgba(255, 250, 238, .16);
  --brass: #E6BC7A;
  --on-brass: #0B0B0C;        /* black type on brass */
  --eyebrow: #E6BC7A;
  --panel: rgba(11, 11, 12, .88);
  --focus: #FF893F;           /* Vein */
  --display-h: clamp(34px, 5.1vw, 78px);
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
:root[data-variant="marble"] {
  --ground: #FFFAEE;
  --fg: #14120E;
  --muted: rgba(20, 18, 14, .7);
  --line: rgba(20, 18, 14, .16);
  --eyebrow: #14120E;
  --panel: rgba(255, 250, 238, .9);
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--fg); font-family: var(--sans); }

.hero { position: relative; min-height: 100%; overflow: hidden; isolation: isolate; }
#field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }

.nav {
  position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 40px 60px 0;
}
.lockup { display: inline-flex; align-items: center; gap: 8px; color: var(--fg); }
.lockup img { width: 38px; height: auto; display: block; }
.lockup svg { height: 25px; width: auto; display: block; }
.lockup .desc { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; color: var(--muted); margin-left: 8px; padding-left: 10px; border-left: 1px solid var(--line); }

.btn {
  font: 500 15px/1 var(--sans); letter-spacing: -.005em; cursor: pointer;
  display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 18px; border-radius: 10px;
  border: 1px solid var(--line); background: transparent; color: var(--fg);
}
.btn-primary { background: var(--brass); color: var(--on-brass); border-color: var(--brass); }
.btn-small { height: 36px; padding: 0 14px; font-size: 14px; border-radius: 8px; }
.btn:focus-visible, .switch button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.btn .arr { font-family: var(--mono); font-size: 14px; }

.content {
  position: relative; z-index: 2; display: grid; gap: 40px; align-content: center;
  min-height: calc(100% - 80px); padding: 120px 60px 140px; box-sizing: border-box; max-width: 900px;
}
.block { justify-self: start; }
.eyebrow { display: inline-flex; align-items: center; gap: 10px; margin: 0 0 28px; font: 500 12px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--eyebrow); }
.eyebrow svg { width: 14px; height: 14px; fill: currentColor; }
h1 { margin: 0; font-weight: 400; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hl { display: flex; align-items: center; }
.hl + .hl { margin-top: calc(var(--display-h) * .12); }
.hl svg { height: var(--display-h); width: auto; display: block; fill: var(--fg); }
.hl .gap { width: calc(var(--display-h) * .2); flex: none; }
.mark { background: var(--brass); padding: 0 calc(var(--display-h) * .06); margin-left: calc(var(--display-h) * -.06); }
.mark svg { fill: var(--on-brass); }
.sub { margin: 0 0 28px; max-width: 30ch; font-size: 20px; line-height: 1.45; color: var(--muted); text-wrap: balance; }
.ctas { display: flex; flex-wrap: wrap; gap: 12px; }

.facts {
  position: absolute; z-index: 2; left: 60px; bottom: 60px; margin: 0;
  font: 500 11px/1.7 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
}
.visual {
  position: absolute; z-index: 1; right: -3vw; bottom: 0; margin: 0;
  height: min(80%, 780px); aspect-ratio: 1271 / 1300; max-width: 54vw; pointer-events: none;
}
.visual img { width: 100%; height: 100%; object-fit: contain; object-position: right bottom; display: block; }

.switch {
  position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--line); font: 500 12px/1 var(--mono); letter-spacing: .06em;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.switch span { color: var(--muted); padding: 0 6px 0 4px; text-transform: uppercase; letter-spacing: .14em; font-size: 10px; }
.switch button { font: inherit; color: var(--fg); background: transparent; border: 1px solid transparent; border-radius: 7px; padding: 7px 10px; cursor: pointer; }
.switch button[aria-pressed="true"] { border-color: var(--line); background: var(--ground); }

@media (max-width: 900px) {
  .nav { padding: 24px 20px 0; }
  .content { padding: 80px 20px 0; min-height: 0; gap: 28px; }
  .visual { position: relative; right: auto; display: block; height: auto; width: min(92%, 520px); max-width: none; margin: 12px 0 0 auto; }
  .facts { position: relative; left: auto; bottom: auto; padding: 28px 20px 96px; }
  .lockup .desc { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
</head>

.8V31.299999999999983C536.8 38.29999999999998 538.0 46.69999999999999 538.0 61.3Z M586.8000000000001 138.7C581.6 151.9 577.6 161.7 571.2 168.7V169.5H599.8000000000001V168.7C595.4000000000001 161.9 597.2 151.9 602.2 138.9L606.4000000000001 127.9H664.4000000000001L668.6 138.5C673.6 151.1 675.8000000000001 162.1 672.0 168.7V169.5H705.2V168.7C699.2 161.5 695.4000000000001 152.1 689.6 137.7L646.2 30.5H628.8000000000001ZM611.8000000000001 114.1 634.6 54.89999999999999H635.6L659.0 114.1Z M718.4000000000001 61.3V138.7C718.4000000000001 153.5 717.2 161.5 712.2 168.7V169.5H744.4000000000001V168.7C739.4000000000001 161.5 738.2 153.5 738.2 138.7V61.3C738.2 46.69999999999999 739.4000000000001 38.29999999999998 744.4000000000001 31.299999999999983V30.5H712.2V31.299999999999983C717.2 38.29999999999998 718.4000000000001 46.69999999999999 718.4000000000001 61.3Z M771.2 138.7C771.2 153.5 770.0000000000001 161.5 765.0000000000001 168.7V169.5H793.0000000000001V168.7C788.0000000000001 161.5 786.6 153.5 786.6 138.7V53.69999999999999H787.6L861.2 169.5H882.2V61.3C882.2 46.69999999999999 883.4000000000001 38.29999999999998 888.4000000000001 31.299999999999983V30.5H860.4000000000001V31.299999999999983C865.4000000000001 38.29999999999998 866.8000000000001 46.69999999999999 866.8000000000001 61.3V141.5H865.8000000000001L795.6 30.5H766.6V30.900000000000006L771.2 38.29999999999998Z M919.6000000000001 171.9C927.0000000000001 171.9 933.2 165.9 933.2 158.3C933.2 150.7 927.0000000000001 144.7 919.6000000000001 144.7C912.0000000000001 144.7 905.8000000000001 150.7 905.8000000000001 158.3C905.8000000000001 165.9 912.0000000000001 171.9 919.6000000000001 171.9Z"/></svg></span></span>

  <figure class="visual"><img src="marble-hand-credit.webp" alt="Marble hand holding a stack of CREDIT coins" width="1271" height="1300"></figure>

</main>

<div class="switch" id="switch" role="group" aria-label="Mockup variant">
  <span>Mockup</span>
  <button type="button" data-v="void" aria-pressed="true">Void</button>
  <button type="button" data-v="marble" aria-pressed="false">Marble</button>
  <button type="button" id="pause">Pause</button>
</div>

<script>
(() => {
  const CELL = 20, GLINT = 800;
  const FONT = '400 10px "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  const BITS = "ORBIO ".split("").map(ch => ch.charCodeAt(0).toString(2).padStart(8, "0")).join("");
  const mix = (a, b, t) => "#" + [1, 3, 5].map(i => Math.round(parseInt(a.substr(i, 2), 16) * (1 - t) + parseInt(b.substr(i, 2), 16) * t).toString(16).padStart(2, "0")).join("");
  // Dimmed fields: tints stay close to the ground; brass is the only hue (Marketplace / CREDIT = brass-dominant).
  const V = {
    void:   { ground: "#0B0B0C", levels: [0, .025, .05, .08, .12].map(t => mix("#0B0B0C", "#E6BC7A", t)), digit: "#E6BC7A", da: .13, pk: .62, line: "#FFFAEE", la: .035 },
    marble: { ground: "#FFFAEE", levels: [0, .05, .10, .17, .26].map(t => mix("#FFFAEE", "#E6BC7A", t)), digit: "#14120E", da: .11, pk: .55, line: "#14120E", la: .05 },
  };
  const SHARES = [.30, .26, .20, .14, .10];

  const root = document.documentElement, hero = document.getElementById("hero");
  const canvas = document.getElementById("field"), ctx = canvas.getContext("2d");
  const bg = document.createElement("canvas"), bgx = bg.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let variant = "void", playing = !reduce;
  let W = 0, H = 0, dpr = 1, cols = 0, rows = 0, n = 0;
  let level, bits, cleared, glint, covers = [];
  let pointer = { x: -1e4, y: -1e4, t: -1e9 };
  const active = new Set();
  let carry = 0, last = performance.now();

  function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const smooth = x => x * x * (3 - 2 * x);
  // Multi-octave value noise over the grid, then quantile levels so the density is identical at any size.
  function field(seed) {
    const r = rng(seed), f = new Float32Array(n);
    for (const [px, amp] of [[260, 1], [120, .5], [CELL, .22]]) {
      const lx = Math.max(2, Math.ceil(cols * CELL / px) + 1), ly = Math.max(2, Math.ceil(rows * CELL / px) + 1);
      const lat = new Float32Array(lx * ly); for (let i = 0; i < lat.length; i++) lat[i] = r();
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const u = x * CELL / px, v = y * CELL / px, x0 = Math.floor(u), y0 = Math.floor(v), fx = smooth(u - x0), fy = smooth(v - y0);
        const a = lat[y0 * lx + x0], b = lat[y0 * lx + x0 + 1], c = lat[(y0 + 1) * lx + x0], d = lat[(y0 + 1) * lx + x0 + 1];
        f[y * cols + x] += amp * ((a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy);
      }
    }
    const order = Array.from(f.keys()).sort((a, b) => f[a] - f[b]), out = new Uint8Array(n);
    let edge = 0, k = 0; const edges = SHARES.map(s => (edge += s) * n);
    order.forEach((idx, i) => { while (i >= edges[k] && k < SHARES.length - 1) k++; out[idx] = k; });
    return out;
  }

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = hero.getBoundingClientRect(); W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); bg.width = canvas.width; bg.height = canvas.height;
    cols = Math.ceil(W / CELL); rows = Math.ceil(H / CELL); n = cols * rows;
    level = field(20260929); bits = new Uint8Array(n); cleared = new Uint8Array(n); glint = new Float64Array(n).fill(-1e9);
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) bits[y * cols + x] = BITS.charCodeAt((x + 5 * y) % 48) === 49 ? 1 : 0;
    measureCovers(); paint();
  }

  // Each [data-cover] element clears whole cells: its box plus one cell of air, rounded out to the grid.
  function measureCovers() {
    const hr = hero.getBoundingClientRect(); covers = []; cleared.fill(0);
    for (const el of document.querySelectorAll("[data-cover]")) {
      const b = el.getBoundingClientRect(); if (!b.width) continue;
      const x0 = Math.max(0, Math.floor((b.left - hr.left) / CELL) - 1), y0 = Math.max(0, Math.floor((b.top - hr.top) / CELL) - 1);
      const x1 = Math.min(cols, Math.ceil((b.right - hr.left) / CELL) + 1), y1 = Math.min(rows, Math.ceil((b.bottom - hr.top) / CELL) + 1);
      covers.push([x0, y0, x1, y1]);
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) cleared[y * cols + x] = 1;
    }
  }

  function paint() {
    const v = V[variant], cs = CELL * dpr, lw = Math.max(1, Math.round(dpr));
    bgx.setTransform(1, 0, 0, 1, 0, 0);
    for (let i = 0; i < n; i++) {
      const x = i % cols, y = (i / cols) | 0, x0 = Math.round(x * cs), y0 = Math.round(y * cs);
      bgx.fillStyle = v.levels[level[i]]; bgx.fillRect(x0, y0, Math.round((x + 1) * cs) - x0, Math.round((y + 1) * cs) - y0);
    }
    bgx.globalAlpha = v.la; bgx.fillStyle = v.line;
    for (let x = 1; x < cols; x++) bgx.fillRect(Math.round(x * cs), 0, lw, bg.height);
    for (let y = 1; y < rows; y++) bgx.fillRect(0, Math.round(y * cs), bg.width, lw);
    bgx.globalAlpha = 1; bgx.fillStyle = v.ground;
    // knock-outs: ground fill inside each cover, leaving its outline as the grid's edge
    for (const [x0, y0, x1, y1] of covers) {
      const a = Math.round(x0 * cs) + lw, b = Math.round(y0 * cs) + lw;
      bgx.fillRect(a, b, Math.round(x1 * cs) - a, Math.round(y1 * cs) - b);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bg, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.font = FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = v.digit;
    const now = performance.now();
    for (let i = 0; i < n; i++) if (!cleared[i]) { ctx.globalAlpha = alpha(i, now); ctx.fillText(bits[i] ? "1" : "0", (i % cols) * CELL + CELL / 2, ((i / cols) | 0) * CELL + CELL / 2 + .5); }
    ctx.globalAlpha = 1;
  }
  function alpha(i, now) { const v = V[variant], g = (now - glint[i]) / GLINT; if (g < 0 || g >= 1) return v.da; const e = 1 - g; return v.da + (v.pk - v.da) * e * e; }
  function drawCell(i, now) {
    const x = i % cols, y = (i / cols) | 0, cs = CELL * dpr;
    const sx = Math.round(x * cs), sy = Math.round(y * cs), sw = Math.round((x + 1) * cs) - sx, sh = Math.round((y + 1) * cs) - sy;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.drawImage(bg, sx, sy, sw, sh, sx, sy, sw, sh);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalAlpha = alpha(i, now);
    ctx.fillText(bits[i] ? "1" : "0", x * CELL + CELL / 2, y * CELL + CELL / 2 + .5); ctx.globalAlpha = 1;
  }
  function flip(i, now) { if (cleared[i]) return; bits[i] ^= 1; glint[i] = now; active.add(i); }

  function frame(now) {
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    if (playing) {
      carry += .05 * n * dt; let k = Math.floor(carry); carry -= k;       // calm: each cell flips every ~20 s
      while (k-- > 0) flip((Math.random() * n) | 0, now);
      if (now - pointer.t < 1200) {
        const R = 4 * CELL, x0 = Math.max(0, Math.floor((pointer.x - R) / CELL)), x1 = Math.min(cols - 1, Math.floor((pointer.x + R) / CELL));
        const y0 = Math.max(0, Math.floor((pointer.y - R) / CELL)), y1 = Math.min(rows - 1, Math.floor((pointer.y + R) / CELL));
        for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
          const d = Math.hypot((x + .5) * CELL - pointer.x, (y + .5) * CELL - pointer.y) / R;
          if (d < 1 && Math.random() < .08 * (1 - d)) flip(y * cols + x, now);
        }
      }
    }
    for (const i of active) { drawCell(i, now); if (now - glint[i] >= GLINT) active.delete(i); }
    requestAnimationFrame(frame);
  }

  hero.addEventListener("pointermove", e => { const r = hero.getBoundingClientRect(); pointer = { x: e.clientX - r.left, y: e.clientY - r.top, t: performance.now() }; });
  hero.addEventListener("pointerleave", () => { pointer.t = -1e9; });
  const sw = document.getElementById("switch"), pauseBtn = document.getElementById("pause");
  function setVariant(k) {
    variant = k; root.dataset.variant = k;
    for (const b of sw.querySelectorAll("[data-v]")) b.setAttribute("aria-pressed", String(b.dataset.v === k));
    try { localStorage.setItem("orbio-protocol-hero-variant", k); } catch (e) { /* storage unavailable */ }
    paint();
  }
  for (const b of sw.querySelectorAll("[data-v]")) b.addEventListener("click", () => setVariant(b.dataset.v));
  function setPlaying(p) { playing = p; pauseBtn.textContent = p ? "Pause" : "Play"; }
  pauseBtn.addEventListener("click", () => setPlaying(!playing));
  window.addEventListener("keydown", e => { if ((e.key === "h" || e.key === "H") && !e.metaKey && !e.ctrlKey) sw.hidden = !sw.hidden; });
  let rt = 0; const relayout = () => { clearTimeout(rt); rt = setTimeout(layout, 120); };
  window.addEventListener("resize", relayout);
  if (window.ResizeObserver) new ResizeObserver(relayout).observe(hero);

  let saved = null; try { saved = localStorage.getItem("orbio-protocol-hero-variant"); } catch (e) { /* storage unavailable */ }
  variant = V[saved] ? saved : "void"; root.dataset.variant = variant;
  for (const b of sw.querySelectorAll("[data-v]")) b.setAttribute("aria-pressed", String(b.dataset.v === variant));
  setPlaying(playing);
  layout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measureCovers(); paint(); });
  requestAnimationFrame(frame);
})();
</script>
