<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbio Bit Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: the bit field is the page. One full-bleed canvas; a compact dock sits bottom-left over it.
   Tokens swap per field version (data-field on <html>) so the dock always reads against the grid. */
:root {
  --ground: #FFFAEE;                 /* Marble: level 0 of every light field */
  --ink: #14120E;                    /* Orbio ink */
  --muted: rgba(20, 18, 14, .64);
  --dock: rgba(255, 250, 238, .93);
  --line: rgba(20, 18, 14, .16);
  --chip-on: #14120E;
  --chip-on-ink: #FFFAEE;
  --focus: #FF893F;                  /* Vein */
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
:root[data-field="void"] {
  --ground: #0B0B0C;
  --ink: #FFFAEE;
  --muted: rgba(255, 250, 238, .62);
  --dock: rgba(11, 11, 12, .9);
  --line: rgba(255, 250, 238, .18);
  --chip-on: #FFFAEE;
  --chip-on-ink: #0B0B0C;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--mono); overflow: hidden; }
#field { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.dock {
  position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(540px, calc(100% - 32px)); box-sizing: border-box;
  display: grid; gap: 12px; padding: 14px 16px 16px;
  background: var(--dock); border: 1px solid var(--line); border-radius: 12px;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  font-size: 12px; line-height: 1.4;
}
.head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.name { font-weight: 500; letter-spacing: .14em; text-transform: uppercase; margin-right: auto; }
.row { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; align-items: center; }
.label { color: var(--muted); letter-spacing: .14em; text-transform: uppercase; font-size: 11px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
button {
  font: inherit; color: inherit; background: transparent; cursor: pointer;
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  display: inline-flex; align-items: center; gap: 7px; letter-spacing: .03em;
}
button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sw { width: 10px; height: 10px; border-radius: 2px; box-shadow: inset 0 0 0 1px var(--line); flex: none; }
.speed { display: flex; align-items: center; gap: 10px; min-width: 0; }
.speed input { flex: 1; min-width: 0; accent-color: var(--ink); }
.val { font-variant-numeric: tabular-nums; min-width: 5ch; text-align: right; }
.note { color: var(--muted); margin: 0; max-width: 60ch; }
.reopen { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--dock); opacity: .45; }
.reopen:hover, .reopen:focus-visible { opacity: 1; }
@media (max-width: 480px) {
  .row { grid-template-columns: 1fr; gap: 6px; }
}
</style>
</head>
<body>


<canvas id="field" role="img" aria-label="Orbio bit field: a grid of tinted cells whose 0s and 1s keep changing"></canvas>

<section class="dock" id="dock" aria-label="Bit field controls">
  <div class="head">
    <span class="name">Orbio bit field</span>
    <button id="play" type="button">Pause</button>
    <button id="hide" type="button" title="Hide controls (H)">Hide</button>
  </div>
  <div class="row"><span class="label" id="l-field">Field</span><div class="chips" id="fields" role="group" aria-labelledby="l-field"></div></div>
  <div class="row"><span class="label" id="l-motion">Motion</span><div class="chips" id="motions" role="group" aria-labelledby="l-motion"></div></div>
  <div class="row"><label class="label" for="speed">Speed</label>
    <div class="speed"><input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"><span class="val" id="speedv">1.00×</span></div>
  </div>
  <p class="note" id="note">Tints stay put; only the 0s and 1s change. Move the pointer over the grid. H hides this panel, Space pauses.</p>
</section>
<button class="reopen" id="reopen" type="button" hidden>Controls</button>

        rowNext[r] = now + (150 / speed) / (0.6 + hash(r, 3) * 1.4);
        rowOff[r]++;
        for (let c = 0; c < cols; c++) { const i = r * cols + c; bits[i] = streamBit(c, r, rowOff[r]); if (!blank[i]) active.add(i); }
      }
    }
    if (now - pointer.t < 1200) {                      // the pointer stirs nearby digits
      const R = 3.2 * CELL;
      const c0 = Math.max(0, Math.floor((pointer.x - R) / CELL)), c1 = Math.min(cols - 1, Math.floor((pointer.x + R) / CELL));
      const r0 = Math.max(0, Math.floor((pointer.y - R) / CELL)), r1 = Math.min(rows - 1, Math.floor((pointer.y + R) / CELL));
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
        const dd = Math.hypot((c + 0.5) * CELL - pointer.x, (r + 0.5) * CELL - pointer.y) / R;
        if (dd < 1 && Math.random() < 0.09 * (1 - dd) * Math.min(2, speed)) flip(r * cols + c, now);
      }
    }
  }

  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (playing) step(now, dt);
    for (const i of active) { drawCell(i, now); if (now - glint[i] >= GLINT) active.delete(i); }
    requestAnimationFrame(frame);
  }

  // Controls
  function chip(parent, key, label, onClick, swatch) {
    const b = document.createElement("button"); b.type = "button"; b.dataset.key = key;
    if (swatch) { const s = document.createElement("span"); s.className = "sw"; s.style.background = swatch; b.appendChild(s); }
    b.appendChild(document.createTextNode(label)); b.addEventListener("click", () => onClick(key));
    parent.appendChild(b); return b;
  }
  const fieldsEl = document.getElementById("fields"), motionsEl = document.getElementById("motions");
  for (const k of Object.keys(DATA)) chip(fieldsEl, k, NAMES[k], setField, DATA[k].p[DATA[k].p.length - 1] === "#545350" ? "#0B0B0C" : DATA[k].p[DATA[k].p.length - 1]);
  for (const k of Object.keys(MOTIONS)) chip(motionsEl, k, MOTIONS[k], setMotion);
  function mark(parent, key) { for (const b of parent.children) b.setAttribute("aria-pressed", String(b.dataset.key === key)); }

  function setField(k) { field = k; root.dataset.field = k === "void" ? "void" : "light"; mark(fieldsEl, k); store.set("field", k); build(); }
  function setMotion(k) {
    const reset = k === "stream" || motion === "stream";
    motion = k; mark(motionsEl, k); store.set("motion", k);
    if (reset) { resetBits(); redrawAll(performance.now()); } else { lastPass.fill(-1e9); carry = 0; }
  }
  function setPlaying(p) {
    playing = p; playBtn.textContent = p ? "Pause" : "Play";
    if (p) note.textContent = "Tints stay put; only the 0s and 1s change. Move the pointer over the grid. H hides this panel, Space pauses.";
  }
  function toggleDock() {
    const hide = !dock.hidden; dock.hidden = hide; reopen.hidden = !hide;
    (hide ? reopen : document.getElementById("hide")).focus({ preventScroll: true });
  }
  playBtn.addEventListener("click", () => setPlaying(!playing));
  document.getElementById("hide").addEventListener("click", toggleDock);
  reopen.addEventListener("click", toggleDock);
  speedIn.addEventListener("input", () => { speed = parseFloat(speedIn.value); speedV.textContent = speed.toFixed(2) + "×"; store.set("speed", speedIn.value); });
  canvas.addEventListener("pointermove", e => { pointer = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  canvas.addEventListener("pointerleave", () => { pointer.t = -1e9; });
  window.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "h" || e.key === "H") { toggleDock(); return; }
    if (e.key === " " && !(e.target instanceof HTMLButtonElement) && !(e.target instanceof HTMLInputElement)) { e.preventDefault(); setPlaying(!playing); }
  });
  let rt = 0;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(layout, 120); });

  // Start: remembered choice, else the viewer's theme (Void for dark, Stone for light).
  const theme = root.getAttribute("data-theme");
  const fallback = theme === "dark" ? "void" : theme === "light" ? "stone" : (matchMedia("(prefers-color-scheme: dark)").matches ? "void" : "stone");
  const savedField = store.get("field"), savedMotion = store.get("motion"), savedSpeed = parseFloat(store.get("speed"));
  field = DATA[savedField] ? savedField : fallback;
  motion = MOTIONS[savedMotion] ? savedMotion : "flicker";
  if (savedSpeed >= 0.25 && savedSpeed <= 3) { speed = savedSpeed; speedIn.value = String(savedSpeed); speedV.textContent = savedSpeed.toFixed(2) + "×"; }
  root.dataset.field = field === "void" ? "void" : "light";
  mark(fieldsEl, field); mark(motionsEl, motion);
  setPlaying(playing);
  if (reduce) note.textContent = "Paused because your system asks for reduced motion. Press Play to preview the animation.";
  layout();
  if (document.fonts && document.fonts.load) document.fonts.load(FONT).then(() => redrawAll(performance.now())).catch(() => {});
  requestAnimationFrame(frame);
})();
</script>

</body>
